[project]
name = "carescribe-models"
version = "0.1.0"
description = "CareScribe internal model-serving microservice (port 9000, not publicly exposed)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "heavy: requires optional ML dependencies or downloaded weights (skipped by default)",
]
